services:
  - type: web
    name: joy-workbench-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
    # 持久化 SQLite 数据库（避免重启丢数据）
    disk:
      name: joydata
      mountPath: /data
      sizeGB: 1
